"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true
palette = 'catppuccin_mocha'

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_commit\
$git_state\
$git_metrics\
$git_status\
$nix_shell\
$cmd_duration
$character"""

right_format = """
$status\
$jobs"""

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"

[username]
style_user = "bold italic yellow"
style_root = "bold italic red"
format = "[$user]($style) "
show_always = false

[hostname]
ssh_only = true
format = "on [$hostname]($style) "
style = "bold italic green"

[directory]
style = "italic blue"
format = "[$path]($style)[$read_only]($read_only_style) "
truncation_length = 3
truncate_to_repo = true
read_only = " 󰌾"
read_only_style = "red"
repo_root_style = "bold blue"
repo_root_format = "[$before_root_path]($before_repo_root_style)[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "

[git_branch]
symbol = " "
format = "[$symbol$branch(:$remote_branch)]($style) "
style = "italic mauve"
truncation_length = 20
truncation_symbol = "…"

[git_commit]
commit_hash_length = 7
format = "[\\($hash$tag\\)]($style) "
style = "italic green"
only_detached = true
tag_symbol = " 󰓹 "

[git_state]
format = "\\([$state( $progress_current/$progress_total)]($style)\\) "
style = "italic yellow"
rebase = "REBASING"
merge = "MERGING"
cherry_pick = "CHERRY-PICKING"

[git_metrics]
format = "([+$added]($added_style) )([-$deleted]($deleted_style) )"
added_style = "italic dimmed green"
deleted_style = "italic dimmed red"
disabled = false
ignore_submodules = true

[git_status]
format = "([$all_status$ahead_behind]($style) )"
style = "italic red"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?"
stashed = "$"
modified = "!"
staged = "+${count}"
renamed = "»"
deleted = "✘"
conflicted = "="

[nix_shell]
disabled = false
symbol = "❄ "
style = "italic bold blue"
format = "[$symbol$state]($style) "
impure_msg = "impure"
pure_msg = "pure"

[cmd_duration]
min_time = 3000
format = "[took $duration]($style) "
style = "italic dimmed yellow"

[status]
disabled = false
format = "[$symbol$status]($style)"
symbol = "✘ "
success_symbol = ""
style = "bold red"

[jobs]
symbol = "✦"
format = "[$symbol$number]($style) "
style = "bold blue"
symbol_threshold = 1

[character]
format = "$symbol "
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"
