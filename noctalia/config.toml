[accessibility]
ui_scale = 1.10

[bar.default]
margin_ends = 0
radius = 0
shadow = false
start = [ "workspaces" ]

[desktop_widgets]
enabled = false

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[shell]
button_borders = false
card_borders = false
corner_radius_scale = 0.0
input_borders = false
popup_borders = false
popup_shadows = false

    [shell.animation]
    enabled = false

    [shell.launcher]
    categories = false
    compact = true

    [shell.panel]
    session_placement = "floating"
    session_position = "center"

    [shell.session]
    show_shortcuts = false

[theme]
builtin = "Ayu"
community_palette = "Cyberpunk"
mode = "dark"
pure_black_dark = true
wallpaper_scheme = "muted"

    [theme.templates]
    builtin_ids = [ "foot", "starship", "sway" ]

[wallpaper]
directory = "/home/lauti/Pictures"

    [wallpaper.default]
    path = "/home/lauti/Pictures/wallpaper.jpg"

    [wallpaper.last]
    path = "/home/lauti/Pictures/wallpaper.jpg"

[weather]
enabled = false

[widget.workspaces]
anchor = true
focused_color = "on_surface"
font_weight = 400
occupied_color = "outline"
style = "minimal"
