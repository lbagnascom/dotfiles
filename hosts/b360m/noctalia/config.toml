    cx = 960.0
    cy = 898.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[shell]
button_borders = false
card_borders = false
corner_radius_scale = 0.0
input_borders = false
polkit_agent = true
popup_borders = false
popup_shadows = false

    [shell.animation]
    enabled = false

    [shell.greeter_sync]
    auto_sync = false

    [shell.launcher]
    categories = false
    compact = true
    fetch_exchange_rates = false

    [shell.panel]
    session_placement = "floating"
    session_position = "center"

    [shell.session]
    grid_columns = 2

[theme]
builtin = "Ayu"
community_palette = "Cyberpunk"
mode = "dark"
pure_black_dark = true
source = "builtin"
wallpaper_scheme = "muted"

    [theme.templates]
    builtin_ids = []
    community_ids = []
    enable_builtin_templates = false
    enable_community_templates = false

[wallpaper]
directory = "/home/lauti/Pictures"

    [wallpaper.default]
    path = "/home/lauti/Pictures/wallpaper.jpg"

    [wallpaper.last]
    path = "/home/lauti/Pictures/wallpaper.jpg"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/lauti/Pictures/wallpaper.jpg"

[weather]
enabled = false

[widget.clock]
format = "{:%H:%M} · {:%d-%m-%Y}"

[widget.media]
hide_when_no_media = true

[widget.network]
show_label = false

[widget.workspaces]
focused_color = "on_surface"
font_weight = 400
interactive = false
occupied_color = "outline"
style = "minimal"
